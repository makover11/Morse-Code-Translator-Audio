<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morse Code Audio Decoder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="morse-audio-app">
    <!-- Extension Header with Studio Mode Launcher -->
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="Morse Audio Logo" class="brand-icon">
        <h1 class="brand-title">Morse Audio <span class="badge">Decoder</span></h1>
      </div>
      <div class="header-actions">
        <button id="btn-open-tab" class="icon-btn" title="Open Full Screen Studio" aria-label="Open Full Screen Studio">
          <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          <span>Studio Mode</span>
        </button>
      </div>
    </header>

    <div class="container">
      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-item">
          <span class="signal-light" id="signal-ind"></span>
          <span>Status:</span> <strong id="stat-state">idle</strong>
        </div>
        <div class="status-item">
          <span>Source:</span> <strong id="stat-source">none</strong>
        </div>
        <div class="status-item">
          <span>Pitch:</span> <strong id="stat-pitch">—</strong>
        </div>
        <div class="status-item">
          <span>WPM:</span> <strong id="stat-wpm">—</strong>
        </div>
      </div>

      <!-- Top Decoder Toolbar -->
      <div class="toolbar">
        <button class="btn-primary" id="btn-listen-mic" title="Decode Morse live from microphone">
          <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
          Listen (Mic)
        </button>

        <input type="file" id="file-input" accept="audio/*">
        <button id="btn-choose-audio" title="Select audio file to decode">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          Choose Audio
        </button>

        <button id="btn-decode-file" class="btn-primary" title="Decode selected audio file">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Decode File
        </button>

        <button id="btn-stop-decode" title="Stop decoding process">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
          Stop Decoding
        </button>

        <div class="toolbar-divider"></div>

        <button id="btn-clear" title="Clear all text fields">Clear All</button>
        <button id="btn-copy-text" title="Copy plain text to clipboard">Copy Text</button>
        <button id="btn-copy-morse" title="Copy morse code to clipboard">Copy Morse</button>
        <button id="btn-export-txt" title="Export as text file">Export TXT</button>
      </div>

      <!-- Oscilloscope Visualizer Card -->
      <div class="visualizer-card">
        <div class="visualizer-container">
          <canvas id="vis-canvas" class="vis-canvas"></canvas>
        </div>
      </div>

      <!-- Text & Morse Code Editor Grid -->
      <div class="grid">
        <div class="input-group">
          <div class="input-header">
            <label class="field-label" for="text-input">Plain Text</label>
            <span id="text-counter" class="counter">0 chars</span>
          </div>
          <textarea id="text-input" placeholder="Type text here to generate Morse code or speak/upload audio to decode..."></textarea>
        </div>

        <div class="input-group">
          <div class="input-header">
            <label class="field-label" for="morse-input">Morse Code (Dots &amp; Dashes)</label>
            <span id="morse-counter" class="counter">0 symbols</span>
          </div>
          <textarea id="morse-input" placeholder="Morse code (. and -) will appear here..."></textarea>
        </div>
      </div>

      <!-- Playback & Download Toolbar -->
      <div class="toolbar">
        <button class="btn-primary" id="btn-play" title="Play Morse audio tone">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Play Audio
        </button>

        <button id="btn-stop-play" title="Stop audio playback">Stop Playback</button>

        <button id="btn-download-wav" title="Generate and download .wav audio">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download Audio (.wav)
        </button>

        <div class="toolbar-divider"></div>

        <label class="toggle-label" for="opt-loop">
          <input type="checkbox" id="opt-loop"> Loop Play
        </label>
        <label class="toggle-label" for="opt-vibrate">
          <input type="checkbox" id="opt-vibrate"> Vibrate
        </label>
        <label class="toggle-label" for="opt-autotune">
          <input type="checkbox" id="opt-autotune" checked> Auto-Detect Pitch
        </label>
      </div>

      <!-- Audio & Decoder Settings -->
      <div class="settings-card">
        <div class="settings-section-title">Audio &amp; Decoder Controls</div>
        <div class="settings-grid">
          <div class="slider-group">
            <label for="speed-slider">
              <span>Playback Speed</span>
              <span class="slider-val" id="speed-val">20 WPM</span>
            </label>
            <input type="range" id="speed-slider" min="5" max="50" value="20">
          </div>

          <div class="slider-group">
            <label for="farnsworth-slider">
              <span>Farnsworth Speed</span>
              <span class="slider-val" id="farnsworth-val">15 WPM</span>
            </label>
            <input type="range" id="farnsworth-slider" min="5" max="50" value="15">
          </div>

          <div class="slider-group">
            <label for="pitch-slider">
              <span>Tone Pitch</span>
              <span class="slider-val" id="pitch-val">600 Hz</span>
            </label>
            <input type="range" id="pitch-slider" min="300" max="1200" value="600">
          </div>

          <div class="slider-group">
            <label for="volume-slider">
              <span>Volume</span>
              <span class="slider-val" id="volume-val">50%</span>
            </label>
            <input type="range" id="volume-slider" min="0" max="100" value="50">
          </div>

          <div class="slider-group">
            <label for="threshold-slider">
              <span>Noise Threshold</span>
              <span class="slider-val" id="threshold-val">-55 dB</span>
            </label>
            <input type="range" id="threshold-slider" min="-75" max="-20" value="-55">
          </div>
        </div>
      </div>

      <!-- Morse Code Reference Chart Accordion -->
      <div class="chart-section">
        <div class="chart-header" id="chart-toggle">
          <span>Morse Code Reference Chart (Click to Insert)</span>
          <span id="chart-arrow">▼</span>
        </div>
        <div class="chart-body" id="chart-body">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </div>

    <!-- Visual Toast -->
    <div id="toast" class="toast">Action completed</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
